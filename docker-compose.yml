services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_PATH: /app/data/common.db
      MIGRATIONS_PATH: file:///app/db/migrations
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    volumes:
      - common-data:/app/data
      - common-uploads:/app/uploads
      - common-avatars:/app/avatars
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
volumes:
  common-data:
  common-uploads:
  common-avatars:
